name: KRYONIX
options:
  bundleIdPrefix: com.kryonix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 20
targets:
  KRYONIX:
    type: application
    platform: iOS
    sources:
      - path: KRYONIX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kryonix.app
        PRODUCT_NAME: KRYONIX
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KRYONIX
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "KRYONIX cần quyền ảnh để bạn chọn ảnh/video cho album, story và hồ sơ."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "KRYONIX chỉ lưu ảnh khi bạn chủ động yêu cầu."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "KRYONIX dùng micro khi bạn chủ động ghi và gửi tin nhắn thoại."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "KRYONIX dùng vị trí khi bạn chủ động bật chia sẻ hoặc lưu một địa điểm."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "KRYONIX dùng media bạn chọn để gắn nhạc vào story."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "KRYONIX dùng Face ID để khóa không gian riêng khi bạn bật tính năng này."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
